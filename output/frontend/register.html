<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - StitchLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="batik-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #BB8A5A 0%, #7A4710 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .gradient-bg { background: linear-gradient(135deg, #BB8A5A 0%, #7A4710 100%); }
        .glass-card { 
            background: white;
            backdrop-filter: blur(20px); 
            border: 2px solid #E9DBC2;
            box-shadow: 0 10px 40px rgba(61, 32, 35, 0.15);
        }
        @keyframes slideInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .animate-slide-in { animation: slideInUp 0.6s ease-out; }
        .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s; }
    </style>
</head>
<body class="batik-hero min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Batik Decorative Corners -->
    <div class="batik-corner batik-corner-tl"></div>
    <div class="batik-corner batik-corner-br"></div>
    <div class="batik-motif batik-motif-center" style="position: absolute; width: 100%; height: 100%; z-index: 0;"></div>
    
    <div class="w-full max-w-md animate-slide-in" style="position: relative; z-index: 1;">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                    </svg>
                </div>
                <span class="text-2xl font-bold" style="color: #2d1810;">StitchLink</span>
            </a>
            <h1 class="text-3xl font-bold mb-2" style="color: #2d1810;">Mulai Perjalanan Anda</h1>
            <p style="color: #3d2023;">Daftar gratis dan bergabung dengan komunitas penjahit</p>
        </div>

        <div class="glass-card rounded-2xl p-8 shadow-2xl batik-card-border">
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #2d1810;">Nama Lengkap *</label>
                    <input type="text" id="fullName" required
                           class="w-full px-4 py-3 rounded-xl transition-all" 
                           style="background-color: rgba(233, 219, 194, 0.3); border: 1px solid #BB8A5A; color: #2d1810;"
                           placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #2d1810;">Email *</label>
                    <input type="email" id="email" required
                           class="w-full px-4 py-3 rounded-xl transition-all" 
                           style="background-color: rgba(233, 219, 194, 0.3); border: 1px solid #BB8A5A; color: #2d1810;"
                           placeholder="nama@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #2d1810;">Password *</label>
                    <div class="relative">
                        <input type="password" id="password" required oninput="checkStrength(this.value)"
                               class="w-full px-4 py-3 rounded-xl transition-all" 
                               style="background-color: rgba(233, 219, 194, 0.3); border: 1px solid #BB8A5A; color: #2d1810;"
                               placeholder="Min. 6 karakter">
                        <button type="button" onclick="togglePwd('password')" class="absolute right-3 top-3.5" style="color: #3d2023;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                    <div class="flex space-x-1 mt-2">
                        <div id="s1" class="strength-bar flex-1" style="background-color: #d4c4b0;"></div>
                        <div id="s2" class="strength-bar flex-1" style="background-color: #d4c4b0;"></div>
                        <div id="s3" class="strength-bar flex-1" style="background-color: #d4c4b0;"></div>
                        <div id="s4" class="strength-bar flex-1" style="background-color: #d4c4b0;"></div>
                    </div>
                    <p id="strengthLabel" class="text-xs mt-1" style="color: #5d4428;"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #2d1810;">Konfirmasi Password *</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required
                               class="w-full px-4 py-3 rounded-xl transition-all" 
                               style="background-color: rgba(233, 219, 194, 0.3); border: 1px solid #BB8A5A; color: #2d1810;"
                               placeholder="Ulangi password">
                        <button type="button" onclick="togglePwd('confirmPassword')" class="absolute right-3 top-3.5" style="color: #3d2023;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>
                <label class="flex items-start text-sm cursor-pointer" style="color: #2d1810;">
                    <input type="checkbox" id="terms" required class="mr-2 mt-1 rounded" style="accent-color: #7A4710;">
                    <span>Saya setuju dengan <a href="#" class="hover:underline" style="color: #3d2023;">Syarat & Ketentuan</a> dan <a href="#" class="hover:underline" style="color: #3d2023;">Kebijakan Privasi</a></span>
                </label>
                <button type="submit" id="registerBtn"
                        class="w-full py-4 gradient-bg rounded-xl font-semibold text-white hover:opacity-90 transition-all transform hover:scale-[1.02] shadow-lg batik-button">
                    Daftar Sekarang
                </button>

                <div class="batik-divider my-4">
                    <span>atau daftar dengan</span>
                </div>

                <button type="button" id="googleSignUp"
                        class="w-full py-4 rounded-xl font-semibold transition-all transform hover:scale-[1.02] flex items-center justify-center space-x-3 shadow-md"
                        style="background-color: white; color: #2d1810; border: 2px solid #E9DBC2;">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Daftar dengan Google</span>
                </button>
            </form>

            <div class="mt-6 text-center text-sm" style="color: #3d2023;">
                Sudah punya akun? <a href="login.html" class="font-semibold hover:underline" style="color: #3d2023;">Masuk di sini</a>
            </div>
        </div>

        <div id="message" class="hidden mt-4 p-4 rounded-xl text-sm text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA8zCy3PBatjnCrEpLEZsfm8CeCYtssZI8",
            authDomain: "nisa-stitchlink.firebaseapp.com",
            projectId: "nisa-stitchlink",
            storageBucket: "nisa-stitchlink.firebasestorage.app",
            messagingSenderId: "226715367934",
            appId: "1:226715367934:web:a444fa37eaf05878cd68af"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.addScope('profile');
        googleProvider.addScope('email');

        // Redirect if already logged in
        onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'dashboard.html'; });

        function showMsg(msg, isError = false) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = `mt-4 p-4 rounded-xl text-sm text-center ${isError ? 'bg-red-500/10 border border-red-500/30 text-red-400' : 'bg-green-500/10 border border-green-500/30 text-green-400'}`;
            el.classList.remove('hidden');
            if (!isError) setTimeout(() => el.classList.add('hidden'), 4000);
        }

        function setLoading(id, loading, text) {
            const btn = document.getElementById(id);
            btn.disabled = loading;
            if (text) btn.textContent = text;
        }

        async function createUserProfile(user, extraData = {}) {
            const userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    displayName: user.displayName || extraData.displayName || 'User',
                    email: user.email,
                    photoURL: user.photoURL || '',
                    bio: '',
                    location: '',
                    following: [],
                    followers: [],
                    createdAt: new Date().toISOString(),
                    ...extraData
                });
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) { showMsg('Password tidak cocok!', true); return; }
            if (password.length < 6) { showMsg('Password minimal 6 karakter!', true); return; }

            setLoading('registerBtn', true, 'Mendaftarkan...');
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: fullName });
                await createUserProfile(cred.user, { displayName: fullName });
                showMsg('Pendaftaran berhasil! Mengalihkan ke dashboard...');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (err) {
                const msgs = {
                    'auth/email-already-in-use': 'Email sudah terdaftar. Silakan login.',
                    'auth/weak-password': 'Password terlalu lemah.',
                    'auth/invalid-email': 'Format email tidak valid.'
                };
                showMsg(msgs[err.code] || 'Terjadi kesalahan. Silakan coba lagi.', true);
            } finally {
                setLoading('registerBtn', false, 'Daftar Sekarang');
            }
        });

        document.getElementById('googleSignUp').addEventListener('click', async () => {
            const btn = document.getElementById('googleSignUp');
            btn.disabled = true;
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await createUserProfile(result.user);
                window.location.href = 'dashboard.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showMsg('Gagal mendaftar dengan Google. Silakan coba lagi.', true);
                }
            } finally {
                btn.disabled = false;
            }
        });

        // Password strength checker
        window.checkStrength = (pwd) => {
            const bars = ['s1','s2','s3','s4'];
            const colors = ['#dc5a46','#f97316','#eab308','#16a34a'];
            const bgDefault = '#d4c4b0';
            const labels = ['','Lemah','Sedang','Kuat','Sangat Kuat'];
            let score = 0;
            if (pwd.length >= 6) score++;
            if (pwd.length >= 10) score++;
            if (/[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;
            bars.forEach((id, i) => {
                const el = document.getElementById(id);
                el.style.backgroundColor = i < score ? colors[score-1] : bgDefault;
            });
            document.getElementById('strengthLabel').textContent = labels[score] ? `Keamanan: ${labels[score]}` : '';
        };

        window.togglePwd = (id) => {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        };
    </script>
</body>
</html>
