<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - StitchLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #BB8A5A 0%, #7A4710 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .gradient-bg { background: linear-gradient(135deg, #BB8A5A 0%, #7A4710 100%); }
        .hero-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(at 47% 33%, hsla(262,77%,46%,0.12) 0, transparent 59%), radial-gradient(at 82% 65%, hsla(218,100%,50%,0.15) 0, transparent 55%);
        }
        .glass-card { background: rgba(30,41,59,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(148,163,184,0.1); }
        @keyframes slideInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .animate-slide-in { animation: slideInUp 0.6s ease-out; }
        .btn-loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body class="hero-pattern min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md animate-slide-in">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 gradient-bg rounded-xl flex items-center justify-center">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                    </svg>
                </div>
                <span class="text-2xl font-bold text-white">StitchLink</span>
            </a>
            <h1 class="text-3xl font-bold text-white mb-2">Reset Password</h1>
            <p class="text-slate-400">Masukkan password baru Anda</p>
        </div>

        <div class="glass-card rounded-2xl p-8 shadow-2xl" id="resetForm">
            <form id="passwordResetForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password Baru</label>
                    <div class="relative">
                        <input type="password" id="newPassword" required minlength="6"
                               class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                               placeholder="Minimal 6 karakter">
                        <button type="button" onclick="togglePassword('newPassword')" class="absolute right-3 top-3.5 text-slate-400 hover:text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Konfirmasi Password</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" required minlength="6"
                               class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all"
                               placeholder="Ketik ulang password">
                        <button type="button" onclick="togglePassword('confirmPassword')" class="absolute right-3 top-3.5 text-slate-400 hover:text-white">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="resetBtn"
                        class="w-full py-4 gradient-bg rounded-xl font-semibold text-white hover:opacity-90 transition-all transform hover:scale-[1.02] shadow-lg shadow-purple-500/30">
                    Reset Password
                </button>
            </form>
        </div>

        <div id="message" class="hidden mt-4 p-4 rounded-xl text-sm text-center"></div>
        
        <div class="mt-6 text-center">
            <a href="login.html" class="text-slate-400 hover:text-white transition-colors text-sm">
                ← Kembali ke Login
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA8zCy3PBatjnCrEpLEZsfm8CeCYtssZI8",
            authDomain: "nisa-stitchlink.firebaseapp.com",
            projectId: "nisa-stitchlink",
            storageBucket: "nisa-stitchlink.firebasestorage.app",
            messagingSenderId: "226715367934",
            appId: "1:226715367934:web:a444fa37eaf05878cd68af"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Get oobCode from URL
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        function showMessage(msg, isSuccess = true) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = `mt-4 p-4 rounded-xl text-sm text-center ${
                isSuccess 
                    ? 'bg-green-500/10 border border-green-500/30 text-green-400' 
                    : 'bg-red-500/10 border border-red-500/30 text-red-400'
            }`;
            el.classList.remove('hidden');
        }

        function setLoading(btn, loading) {
            btn.classList.toggle('btn-loading', loading);
            btn.disabled = loading;
        }

        // Verify the reset code
        if (!oobCode) {
            showMessage('❌ Link reset password tidak valid atau sudah kedaluwarsa.', false);
            document.getElementById('resetForm').style.display = 'none';
        } else {
            // Verify code validity
            verifyPasswordResetCode(auth, oobCode)
                .then((email) => {
                    console.log('Valid reset code for:', email);
                })
                .catch((error) => {
                    console.error('Invalid reset code:', error);
                    showMessage('❌ Link reset password tidak valid atau sudah kedaluwarsa.', false);
                    document.getElementById('resetForm').style.display = 'none';
                });
        }

        window.togglePassword = (id) => {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        };

        document.getElementById('passwordResetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('❌ Password tidak cocok. Silakan coba lagi.', false);
                return;
            }

            // Validate password length
            if (newPassword.length < 6) {
                showMessage('❌ Password minimal 6 karakter.', false);
                return;
            }

            setLoading(btn, true);
            btn.textContent = 'Mereset...';

            try {
                await confirmPasswordReset(auth, oobCode, newPassword);
                showMessage('✅ Password berhasil direset! Anda akan diarahkan ke halaman login...', true);
                document.getElementById('resetForm').style.display = 'none';
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                console.error('Password reset error:', error);
                const msgs = {
                    'auth/expired-action-code': 'Link reset password sudah kedaluwarsa. Silakan minta link baru.',
                    'auth/invalid-action-code': 'Link reset password tidak valid. Silakan minta link baru.',
                    'auth/weak-password': 'Password terlalu lemah. Gunakan kombinasi huruf, angka, dan simbol.',
                    'auth/user-disabled': 'Akun ini telah dinonaktifkan.',
                    'auth/user-not-found': 'Akun tidak ditemukan.'
                };
                showMessage(msgs[error.code] || '❌ Gagal reset password. Silakan coba lagi.', false);
            } finally {
                setLoading(btn, false);
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
